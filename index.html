<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXE Ice Fishing · play in your browser</title>
<style>
@font-face{font-family:Fredoka;font-weight:600;src:url(assets/fonts/fredoka-latin-600-normal.woff2)}
@font-face{font-family:Fredoka;font-weight:700;src:url(assets/fonts/fredoka-latin-700-normal.woff2)}
:root{--cream:#fff8ea;--red:#8f1c22;--gold:#e6c27c;--ink:#7a1418;--bg:#121833}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(1200px 700px at 30% 10%,#25204a 0%,var(--bg) 60%);color:#f3e2c2;font-family:Fredoka,system-ui,sans-serif;min-height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1240px;margin:0 auto;padding:16px 16px 4px}
h1{font-size:26px;margin:0;letter-spacing:.5px;color:var(--cream)}
h1 small{display:block;font-size:14px;font-weight:600;color:#c9b8d8;letter-spacing:0}
.stage{position:relative;max-width:1240px;margin:0 auto;padding:0 16px}
#c{display:block;width:100%;height:auto;cursor:default}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;max-width:1240px;margin:6px auto 0;padding:0 16px}
.card{background:rgba(10,14,32,.75);border:2px solid rgba(230,194,124,.35);border-radius:22px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
button,select,input{font:700 17px Fredoka,system-ui,sans-serif;border-radius:16px}
button{background:var(--red);color:var(--cream);border:3px solid var(--gold);padding:9px 16px;cursor:pointer;transition:transform .08s}
button:hover{transform:translateY(-1px)}button:active{transform:translateY(1px)}
button.big{font-size:24px;padding:12px 30px;background:#2f8a7a;border-color:#bff0e0}
button.tab{background:var(--tc,#555);border-color:rgba(255,255,255,.35)}
button:disabled{opacity:.55;cursor:default;transform:none}
input,select{background:var(--cream);color:var(--ink);border:3px solid var(--red);padding:8px 12px}
input{width:170px}
label{font-weight:600;color:#e9dcc6;font-size:15px}
.demo{margin:12px auto 26px;max-width:1240px;padding:0 16px}
.demo .card{border-style:dashed;border-color:rgba(185,138,255,.45)}
.demo h2{font-size:15px;margin:0 6px 0 0;color:#cdb6ff;font-weight:700}
footer{text-align:center;opacity:.55;font-size:13px;padding:0 16px 22px}
@media (max-width:700px){h1{font-size:20px}button.big{font-size:20px;padding:10px 22px}input{width:130px}}
</style></head><body>
<header><h1>EXE Ice Fishing<small>play in your browser · progress is saved on this device</small></h1></header>
<div class="stage"><canvas id="c" width="1600" height="1024" aria-label="EXE Ice Fishing game"></canvas></div>
<div class="bar"><div class="card">
  <label for="nm">Your name</label><input id="nm" maxlength="20" autocomplete="off">
  <button class="big" id="fish">Fish!</button><span id="cd" style="min-width:58px;font-weight:600;color:#bff0e0"></span>
  <button class="tab" style="--tc:#9a6ff0" data-p="dex">Fishdex</button>
  <button class="tab" style="--tc:#c8901c" data-p="shop">Shop</button>
  <button class="tab" style="--tc:#d8643a" data-p="bag">Bag</button>
  <button class="tab" style="--tc:#c83a46" data-p="quests">Quests</button>
  <label for="ss">Season</label><select id="ss"><option value="christmas">Christmas</option><option value="winter">Winter</option><option value="spring">Spring</option><option value="autumn">Autumn</option></select>
  <button id="snd" title="sound">Sound: on</button>
</div></div>
<div class="demo"><div class="card"><h2>Stream demo</h2>
  <button id="crowd">Add chat viewers</button>
  <button id="storm">Aurora storm (sub)</button>
  <button id="raid">Raid</button>
  <button id="reset">Reset my progress</button>
</div></div>
<footer>EXE Ice Fishing · a StreamElements widget for Twitch by form&amp;soul.exe — on stream, viewers play by typing !fish in chat</footer>
<script>
(function(){
  const get = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
  const set = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };
  const season = (location.search.match(/season=(\w+)/)||[])[1] || get('exe-icefish-season') || 'christmas';
  const sound = get('exe-icefish-sound') !== 'off';
  window.EXE_CFG = { assetBase:'assets/', season, storeKey:'exe-icefish-browser', sound, volume:0.7, cooldown:6, idleLeave:600, panelCooldown:0, panelDur:14,
    clickShop:true, instantMenus:true, hint:'press Fish! to catch a creature', hintDelay:2, escapeChance:0.05 };
  window.BROWSER = { season, sound, get, set };
})();
</script>
<script src="engine/icefish.js"></script>
<script>
(function(){
  const B = window.BROWSER, $ = id => document.getElementById(id), cv = $('c');
  const BOTS = ['kiwi','luna_bytes','tobi','pip_pop','mochi_cat','snowpea'];
  let me = B.get('exe-icefish-name') || ('angler' + Math.floor(100 + Math.random()*900));
  $('nm').value = me; $('ss').value = B.season; $('snd').textContent = 'Sound: ' + (B.sound ? 'on' : 'off');
  $('nm').addEventListener('change', () => { const v = $('nm').value.trim().replace(/\s+/g,'_').slice(0,20); if (v) { me = v; B.set('exe-icefish-name', v); } $('nm').value = me; });
  const cmd = c => EXE.onChat(me, c, { roles: { broadcaster: true } });
  $('fish').onclick = () => cmd('!fish');
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => cmd('!' + b.dataset.p));
  $('ss').onchange = () => { B.set('exe-icefish-season', $('ss').value); location.search = '?season=' + $('ss').value; };
  $('snd').onclick = () => { B.set('exe-icefish-sound', B.sound ? 'off' : 'on'); location.reload(); };
  // click a shop row to buy; click anywhere else on the canvas to close a menu
  cv.addEventListener('click', e => { const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * cv.width / r.width, y = (e.clientY - r.top) * cv.height / r.height;
    if (!EXE.clickAt(x, y)) EXE.closePanel(); });
  // space / F to fish
  window.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return; if (e.code === 'Space' || e.key === 'f') { e.preventDefault(); cmd('!fish'); } });
  // cooldown readout
  setInterval(() => { const d = window.EXE_DEBUG && EXE_DEBUG(); const v = EXE.S.viewers[me]; $('cd').textContent = v ? v.coins + ' ¢' : ''; }, 300);
  // demo
  let crowd = null;
  $('crowd').onclick = () => { if (crowd) { clearInterval(crowd); crowd = null; $('crowd').textContent = 'Add chat viewers'; return; }
    let k = 0; const tick = () => { EXE.onChat(BOTS[k++ % BOTS.length], '!fish', { roles: { broadcaster: true } }); }; tick(); crowd = setInterval(tick, 2500); $('crowd').textContent = 'Stop chat viewers'; };
  $('storm').onclick = () => EXE.onEvent({ type: 'subscriber', name: 'pip_pop' }, true);
  $('raid').onclick = () => EXE.onEvent({ type: 'raid', name: 'cozyqueen', amount: 10 }, true);
  $('reset').onclick = () => { if (!$('reset').dataset.sure) { $('reset').dataset.sure = 1; $('reset').textContent = 'Click again to reset'; setTimeout(() => { delete $('reset').dataset.sure; $('reset').textContent = 'Reset my progress'; }, 3000); return; }
    try { localStorage.removeItem('exe-icefish-browser'); } catch(e) {} location.reload(); };
})();
</script>
</body></html>
